<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Конвертер валют</title>
    <meta name="theme-color" content="#2f7fd6" />
    <link rel="manifest" href="manifest.json" />
    <link rel="apple-touch-icon" href="icons/icon-192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Валюты" />
    <meta name="mobile-web-app-capable" content="yes" />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      :root {
        --ink: #16324a;
        --muted: #6a8098;
        --line: rgba(22, 50, 74, 0.13);
        --accent: #2f7fd6;
        --card-alpha: 0.44;
      }

      html,
      body {
        height: 100%;
      }

      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: calc(18px + env(safe-area-inset-top)) 12px
          calc(18px + env(safe-area-inset-bottom));
        font-family:
          system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          sans-serif;
        color: var(--ink);
        background: linear-gradient(
          165deg,
          #fbfdff 0%,
          #edf4fb 45%,
          #dfeaf5 100%
        );
        -webkit-tap-highlight-color: transparent;
        overscroll-behavior: none;
      }

      .map-layer {
        position: fixed;
        inset: 0;
        z-index: 0;
        pointer-events: none;
        overflow: hidden;
      }
      .map-layer img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: center 42%;
        filter: grayscale(1) contrast(115%);
        opacity: 0.3;
        mix-blend-mode: multiply;
      }

      .app {
        position: relative;
        z-index: 1;
        width: 100%;
        max-width: 800px;
        padding: 18px;
        border-radius: 26px;
        background: rgba(255, 255, 255, var(--card-alpha));
        border: 1px solid rgba(255, 255, 255, 0.8);
        box-shadow:
          0 24px 60px rgba(31, 64, 104, 0.18),
          inset 0 1px 0 rgba(255, 255, 255, 0.9);
        backdrop-filter: blur(10px) saturate(130%);
        -webkit-backdrop-filter: blur(10px) saturate(130%);
      }

      h1 {
        font-size: 17px;
        font-weight: 700;
        text-align: center;
        margin-bottom: 16px;
        color: #123049;
      }

      .panels {
        display: grid;
        grid-template-columns: 1fr auto 1fr;
        gap: 10px;
        align-items: stretch;
      }

      .panel {
        display: flex;
        flex-direction: column;
        gap: 9px;
        min-height: 178px;
        padding: 12px;
        border-radius: 19px;
        background: linear-gradient(
          160deg,
          rgba(255, 255, 255, 0.96),
          rgba(237, 245, 253, 0.9)
        );
        border: 1px solid var(--line);
        box-shadow:
          inset 0 1px 0 #fff,
          0 8px 20px rgba(31, 64, 104, 0.07);
      }
      .panel.out {
        background: linear-gradient(
          160deg,
          rgba(255, 255, 255, 0.96),
          rgba(230, 242, 255, 0.9)
        );
        border-color: rgba(47, 127, 214, 0.32);
      }

      .panel-head {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .flag {
        flex: 0 0 auto;
        width: 44px;
        height: 31px;
        border-radius: 7px;
        object-fit: cover;
        background: #dfe8f2;
        box-shadow: 0 2px 8px rgba(22, 50, 74, 0.22);
      }
      .curr-select {
        flex: 1 1 auto;
        min-width: 0;
        padding: 6px 2px;
        font-size: 15px;
        font-weight: 700;
        color: var(--ink);
        border: none;
        border-radius: 8px;
        background: transparent;
        cursor: pointer;
        outline: none;
        -webkit-appearance: none;
        appearance: none;
      }
      .curr-select:focus {
        box-shadow: 0 0 0 2px rgba(47, 127, 214, 0.35);
      }
      .note {
        flex: 0 0 auto;
        width: 54px;
        height: 31px;
        border-radius: 6px;
        display: grid;
        place-items: center;
        font-size: 11px;
        font-weight: 700;
        color: rgba(0, 0, 0, 0.62);
        border: 1px solid rgba(0, 0, 0, 0.14);
        background: #e7eef6;
        box-shadow:
          inset 0 0 0 2px rgba(255, 255, 255, 0.5),
          0 3px 10px rgba(22, 50, 74, 0.18);
      }

      .field-label {
        font-size: 10.5px;
        letter-spacing: 0.7px;
        text-transform: uppercase;
        color: var(--muted);
        margin-top: auto;
      }

      .amount-row {
        display: flex;
        align-items: stretch;
        gap: 7px;
      }

      .amount-box {
        flex: 1 1 auto;
        min-width: 0;
        display: flex;
        align-items: center;
        height: 56px;
        padding: 0 11px;
        border-radius: 14px;
        border: 1px solid var(--line);
        background: rgba(255, 255, 255, 0.94);
        transition:
          border-color 0.2s,
          box-shadow 0.2s;
      }
      .amount-box.no-input {
        background: rgba(255, 255, 255, 0.7);
      }
      .amount-box:focus-within {
        border-color: var(--accent);
        box-shadow: 0 0 0 3px rgba(47, 127, 214, 0.16);
      }

      .amount-input {
        width: 100%;
        height: 100%;
        border: none;
        background: transparent;
        outline: none;
        font-size: 21px;
        font-weight: 700;
        font-variant-numeric: tabular-nums;
        color: var(--ink);
      }
      .amount-input::placeholder {
        color: rgba(22, 50, 74, 0.3);
      }

      .amount-value {
        width: 100%;
        font-size: 21px;
        font-weight: 700;
        font-variant-numeric: tabular-nums;
        color: var(--ink);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .curr-badge {
        flex: 0 0 auto;
        width: 96px;
        height: 56px;
        padding: 5px 7px;
        border-radius: 14px;
        border: 1px solid rgba(47, 127, 214, 0.3);
        background: linear-gradient(
          160deg,
          rgba(240, 247, 255, 0.95),
          rgba(224, 238, 253, 0.9)
        );
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 1px;
        overflow: hidden;
      }
      .curr-badge .badge-name {
        font-size: 11px;
        font-weight: 700;
        line-height: 1.15;
        color: #1b4470;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }
      .curr-badge .badge-code {
        font-size: 9.5px;
        letter-spacing: 0.6px;
        font-weight: 700;
        color: var(--accent);
      }

      .swap {
        align-self: center;
        width: 42px;
        height: 42px;
        font-size: 17px;
        border-radius: 50%;
        border: 1px solid var(--line);
        background: rgba(255, 255, 255, 0.95);
        color: var(--accent);
        cursor: pointer;
        box-shadow: 0 6px 16px rgba(31, 64, 104, 0.14);
        transition:
          transform 0.35s,
          box-shadow 0.2s;
      }
      .swap:active {
        transform: rotate(180deg) scale(0.94);
      }

      .rate {
        margin-top: 12px;
        padding-top: 11px;
        border-top: 1px solid var(--line);
        font-size: 12.5px;
        text-align: center;
        color: var(--muted);
        min-height: 40px;
      }
      .rate b {
        color: var(--ink);
        font-variant-numeric: tabular-nums;
      }

      .status {
        font-size: 11px;
        text-align: center;
        color: var(--muted);
        min-height: 15px;
      }
      .status.error {
        color: #c0392b;
      }

      @media (max-width: 620px) {
        .panels {
          grid-template-columns: 1fr;
        }
        .panel {
          min-height: 158px;
          padding: 11px;
        }
        .swap {
          justify-self: center;
        }
        .swap span {
          display: inline-block;
          transform: rotate(90deg);
        }
        .amount-input,
        .amount-value {
          font-size: 20px;
        }
        .curr-badge {
          width: 88px;
        }
        .app {
          padding: 15px;
          border-radius: 22px;
        }
        .map-layer img {
          opacity: 0.24;
        }
      }
    </style>
  </head>
  <body>
    <div class="map-layer">
      <img
        alt=""
        src="https://upload.wikimedia.org/wikipedia/commons/8/83/BlankMap-World.svg"
      />
    </div>

    <div class="app">
      <h1>Конвертер валют</h1>

      <div class="panels">
        <div class="panel">
          <div class="panel-head">
            <img class="flag" id="flagFrom" alt="" />
            <select class="curr-select" id="from"></select>
            <div class="note" id="noteFrom"></div>
          </div>
          <span class="field-label">Сумма</span>
          <div class="amount-row">
            <div class="amount-box">
              <input
                class="amount-input"
                id="amount"
                type="text"
                inputmode="decimal"
                autocomplete="off"
                value="100"
                placeholder="0"
              />
            </div>
            <div class="curr-badge">
              <span class="badge-name" id="nameFrom"></span>
              <span class="badge-code" id="codeFrom"></span>
            </div>
          </div>
        </div>

        <button class="swap" id="swap" title="Поменять валюты">
          <span>⇄</span>
        </button>

        <div class="panel out">
          <div class="panel-head">
            <img class="flag" id="flagTo" alt="" />
            <select class="curr-select" id="to"></select>
            <div class="note" id="noteTo"></div>
          </div>
          <span class="field-label">Получится</span>
          <div class="amount-row">
            <div class="amount-box no-input">
              <div class="amount-value" id="result">—</div>
            </div>
            <div class="curr-badge">
              <span class="badge-name" id="nameTo"></span>
              <span class="badge-code" id="codeTo"></span>
            </div>
          </div>
        </div>
      </div>

      <div class="rate" id="rate"></div>
      <div class="status" id="status"></div>
    </div>

    <script>
      "use strict";

      const $ = (id) => document.getElementById(id);

      const CURRENCIES = {
        USD: { name: "Доллар США", cc: "US", note: "100" },
        EUR: { name: "Евро", cc: "EU", note: "100" },
        RUB: { name: "Рубль", cc: "RU", note: "1000" },
        GBP: { name: "Фунт", cc: "GB", note: "10" },
        CNY: { name: "Юань", cc: "CN", note: "100" },
        JPY: { name: "Иена", cc: "JP", note: "1000" },
        TRY: { name: "Лира", cc: "TR", note: "100" },
        KZT: { name: "Тенге", cc: "KZ", note: "5000" },
        AED: { name: "Дирхам", cc: "AE", note: "100" },
        GEL: { name: "Лари", cc: "GE", note: "50" },
        CHF: { name: "Франк", cc: "CH", note: "100" },
        INR: { name: "Рупия", cc: "IN", note: "500" },
      };

      const CODES = Object.keys(CURRENCIES);
      const API = "https://open.er-api.com/v6/latest/USD";
      const TTL = 30 * 60 * 1000;
      const CACHE_KEY = "rates-cache-v1";

      let rates = null;
      let fetchedAt = 0;
      let updatedText = "";
      let seq = 0;

      function fillSelect(select, selected) {
        select.innerHTML = "";
        for (const code of CODES) {
          const opt = document.createElement("option");
          opt.value = code;
          opt.textContent = code;
          opt.title = CURRENCIES[code].name;
          if (code === selected) opt.selected = true;
          select.appendChild(opt);
        }
      }

      function paintPanel(code, flagEl, noteEl, nameEl, codeEl) {
        const c = CURRENCIES[code];
        flagEl.src =
          "https://flagcdn.com/w80/" +
          (c.cc === "EU" ? "eu" : c.cc.toLowerCase()) +
          ".png";
        flagEl.alt = code;
        noteEl.textContent = c.note;
        nameEl.textContent = c.name;
        codeEl.textContent = code;
      }

      function parseAmount(text) {
        const clean = String(text)
          .replace(/\s/g, "")
          .replace(",", ".")
          .replace(/[^\d.]/g, "");
        const n = parseFloat(clean);
        return Number.isFinite(n) ? n : 0;
      }

      function fmt(value) {
        const max = value >= 1 ? 2 : 4;
        return new Intl.NumberFormat("ru-RU", {
          minimumFractionDigits: value >= 1 ? 2 : 4,
          maximumFractionDigits: max,
        }).format(value);
      }

      function setStatus(text, isError = false) {
        $("status").textContent = text;
        $("status").classList.toggle("error", isError);
      }

      function readCache() {
        try {
          const raw = localStorage.getItem(CACHE_KEY);
          if (!raw) return false;
          const data = JSON.parse(raw);
          if (!data || !data.rates || !data.rates.USD) return false;
          rates = data.rates;
          fetchedAt = data.fetchedAt || 0;
          updatedText = data.updatedText || "";
          return true;
        } catch (e) {
          return false;
        }
      }

      function writeCache() {
        try {
          localStorage.setItem(
            CACHE_KEY,
            JSON.stringify({ rates, fetchedAt, updatedText }),
          );
        } catch (e) {}
      }

      async function ensureRates() {
        if (rates && Date.now() - fetchedAt < TTL) return rates;

        const res = await fetch(API, { cache: "no-store" });
        if (!res.ok) throw new Error("сервер ответил " + res.status);

        const data = await res.json();
        if (!data || data.result !== "success" || !data.rates)
          throw new Error("пустой ответ");

        rates = data.rates;
        fetchedAt = Date.now();

        const stamp = data.time_last_update_utc
          ? new Date(data.time_last_update_utc)
          : new Date();
        updatedText = stamp.toLocaleDateString("ru-RU", {
          day: "2-digit",
          month: "long",
        });

        writeCache();
        return rates;
      }

      function showResult(amount, from, to) {
        if (from === to) {
          $("result").textContent = fmt(amount);
          $("rate").innerHTML = "Одна и та же валюта";
          return;
        }

        const r = rates[to] / rates[from];
        $("result").textContent = fmt(amount * r);
        $("rate").innerHTML =
          "1 " +
          from +
          " = <b>" +
          fmt(r) +
          "</b> " +
          to +
          " · 1 " +
          to +
          " = <b>" +
          fmt(1 / r) +
          "</b> " +
          from;
      }

      async function convert() {
        const mySeq = ++seq;
        const from = $("from").value;
        const to = $("to").value;

        paintPanel(
          from,
          $("flagFrom"),
          $("noteFrom"),
          $("nameFrom"),
          $("codeFrom"),
        );
        paintPanel(to, $("flagTo"), $("noteTo"), $("nameTo"), $("codeTo"));

        const amount = parseAmount($("amount").value);

        if (rates && rates[from] && rates[to]) {
          showResult(amount, from, to);
        }

        try {
          await ensureRates();
          if (mySeq !== seq) return;
          showResult(amount, from, to);
          setStatus(
            from === to ? "" : "Курсы на " + updatedText + " · open.er-api.com",
          );
        } catch (e) {
          if (mySeq !== seq) return;
          if (rates && rates[from] && rates[to]) {
            showResult(amount, from, to);
            setStatus("Нет сети — показываю сохранённый курс", true);
          } else {
            $("result").textContent = "—";
            $("rate").textContent = "";
            setStatus("Курс не загрузился: " + e.message, true);
          }
        }
      }

      let timer = null;
      function scheduleConvert() {
        clearTimeout(timer);
        timer = setTimeout(convert, 120);
      }

      $("amount").addEventListener("input", scheduleConvert);

      $("from").addEventListener("change", () => {
        if ($("from").value === $("to").value) {
          $("to").value = CODES.find((c) => c !== $("from").value);
        }
        convert();
      });

      $("to").addEventListener("change", () => {
        if ($("to").value === $("from").value) {
          $("from").value = CODES.find((c) => c !== $("to").value);
        }
        convert();
      });

      $("swap").addEventListener("click", () => {
        const from = $("from").value;
        $("from").value = $("to").value;
        $("to").value = from;
        convert();
      });

      fillSelect($("from"), "USD");
      fillSelect($("to"), "RUB");
      readCache();

      if (
        "serviceWorker" in navigator &&
        location.protocol.startsWith("http")
      ) {
        window.addEventListener("load", () => {
          navigator.serviceWorker.register("sw.js").catch(() => {});
        });
      }

      convert();
    </script>
  </body>
</html>
